<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Live Orbit Tracker & Simulator</title>
    
    <!-- Google Tag Manager / Analytics (Dynamically loaded via config.js) -->
    <script src="config.js" onerror="this.remove()"></script>
    <script>
        if (typeof GTM_ID !== 'undefined' && GTM_ID) {
            const gtmScript = document.createElement('script');
            gtmScript.async = true;
            gtmScript.src = `https://www.googletagmanager.com/gtag/js?id=${GTM_ID}`;
            document.head.appendChild(gtmScript);
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', GTM_ID);
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: rgba(18, 24, 38, 0.88);
            --panel-border: rgba(0, 243, 255, 0.3);
            --accent-cyan: #00ffff;
            --accent-pink: #ff007f;
            --accent-glow: rgba(0, 255, 255, 0.5);
            --text-main: #f0f4f8;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: var(--bg-dark);
        }

        /* Glassmorphic UI Overlay */
        .hud-header {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 0, 127, 0.2);
            color: #ff007f;
            border: 1px solid rgba(255, 0, 127, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #ff007f;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 0, 127, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); }
        }

        /* Telemetry Dashboard */
        .hud-dashboard {
            position: absolute;
            top: 76px;
            left: 16px;
            z-index: 1000;
            width: 330px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .telemetry-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
        }

        .card-label {
            font-size: 0.68rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-cyan);
            word-break: break-all;
        }

        .card-unit {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: normal;
        }

        /* Simulator Controls */
        .sim-controls {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 14px;
        }

        .sim-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .datetime-input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        input[type="datetime-local"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            outline: none;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(0, 119, 255, 0.5));
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.5), rgba(0, 119, 255, 0.75));
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            box-shadow: none;
        }

        .btn-active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(0, 119, 255, 0.7)) !important;
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 12px var(--accent-glow) !important;
        }

        .control-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Map Legend Panel */
        .hud-legend {
            position: absolute;
            bottom: 24px;
            right: 16px;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.78rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 22px;
            height: 5px;
            border-radius: 2px;
        }

        /* Toggle Panel Button for Mobile */
        .hud-toggle-btn {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1001;
            width: 42px;
            height: 42px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--accent-cyan);
            font-size: 1.2rem;
            cursor: pointer;
            backdrop-filter: blur(16px);
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            .hud-dashboard {
                width: calc(100% - 32px);
                max-height: 70vh;
                overflow-y: auto;
            }
            
            .hud-dashboard.collapsed {
                display: none;
            }

            .hud-toggle-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hud-header {
                max-width: calc(100% - 80px);
                padding: 8px 12px;
            }

            .hud-title {
                font-size: 0.9rem;
            }

            .hud-legend {
                bottom: 16px;
                right: 16px;
                font-size: 0.72rem;
            }
        }

        /* Custom Leaflet Dark Theme Overrides & Map Tile Brightness */
        .leaflet-container {
            background-color: var(--bg-dark) !important;
        }

        .leaflet-tile-pane {
            filter: brightness(2.1) contrast(1.15) saturate(1.1);
        }
        
        .leaflet-control-zoom {
            border: 1px solid var(--panel-border) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6) !important;
            border-radius: 8px !important;
            overflow: hidden;
        }

        .leaflet-control-zoom a {
            background: var(--panel-bg) !important;
            color: var(--accent-cyan) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .leaflet-control-zoom a:hover {
            background: rgba(0, 243, 255, 0.25) !important;
        }

        .leaflet-popup-content-wrapper {
            background: var(--panel-bg) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            color: var(--text-main) !important;
            border-radius: 10px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7) !important;
        }

        .leaflet-popup-tip {
            background: var(--panel-bg) !important;
        }

        .iss-icon-glow {
            filter: drop-shadow(0 0 12px #00ffff);
            transition: transform 0.5s linear;
        }

        .orbit-marker-badge {
            background: rgba(0, 243, 255, 0.9);
            color: #0b0e14;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Header Overlay -->
    <div class="hud-header">
        <div class="hud-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            ISS TRACKER
        </div>
        <div class="live-badge" id="live-indicator">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <!-- Mobile Panel Toggle Button -->
    <button class="hud-toggle-btn" id="toggle-dashboard-btn" aria-label="Toggle Panel">
        ⚙
    </button>

    <!-- Dashboard Overlay -->
    <div class="hud-dashboard" id="dashboard">
        <div class="telemetry-grid">
            <div class="telemetry-card">
                <div class="card-label">緯度 (LAT)</div>
                <div class="card-value" id="val-lat">--.----°</div>
            </div>
            <div class="telemetry-card">
                <div class="card-label">経度 (LNG)</div>
                <div class="card-value" id="val-lng">--.----°</div>
            </div>
            <div class="telemetry-card">
                <div class="card-label">高度 (ALT)</div>
                <div class="card-value" id="val-alt">--- <span class="card-unit">km</span></div>
            </div>
            <div class="telemetry-card">
                <div class="card-label">速度 (VEL)</div>
                <div class="card-value" id="val-speed">--- <span class="card-unit">km/h</span></div>
            </div>
        </div>

        <div class="sim-controls">
            <div class="sim-title">
                <span>軌道シミュレーション</span>
                <span id="sim-status" style="font-size: 0.7rem; color: var(--accent-cyan);">リアルタイム動作中</span>
            </div>
            <div class="datetime-input-group">
                <input type="datetime-local" id="datetime-picker">
            </div>
            <div class="control-actions">
                <button class="btn" id="btn-jump">日時移動</button>
                <button class="btn btn-secondary" id="btn-reset">現在時刻に戻る</button>
            </div>
            <div style="margin-top: 10px; display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-active" id="btn-recenter" style="width: 100%;">
                    📍 ISSの位置を中心に表示
                </button>
            </div>
        </div>
    </div>

    <!-- Legend Overlay -->
    <div class="hud-legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #00ffff; box-shadow: 0 0 10px #00ffff;"></div>
            <span>未来1時間の予測軌道 (水色)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff007f; box-shadow: 0 0 10px #ff007f;"></div>
            <span>過去1時間の飛行軌跡 (ピンク破線)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(0, 243, 255, 0.2); border: 1px solid var(--accent-cyan); height: 8px; border-radius: 4px;"></div>
            <span>ISSの可視領域 (Footprint)</span>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <script>
        // Standard Fallback TLE Dataset
        const FALLBACK_TLE = {
            line1: "1 25544U 98067A   26206.44322024  .00008631  00000+0  16367-3 0  9990",
            line2: "2 25544  51.6316 110.7757 0006908 336.1751  23.8916 15.49160253577689"
        };

        // Application State
        let map = null;
        let terminator = null;
        let issMarker = null;
        let footprintCircle = null;
        let satrec = null;

        // Synchronous initial satrec initialization guarantees 0ms readiness
        try {
            satrec = satellite.twoline2satrec(FALLBACK_TLE.line1, FALLBACK_TLE.line2);
        } catch(e) {
            console.warn('Initial satrec fallback error:', e);
        }

        // Single Unbroken Persistent Orbit Polyline Objects
        let pastPolylineGlow = null;
        let pastPolylineCore = null;

        let futurePolylineGlow = null;
        let futurePolylineCore = null;
        
        let timeBadgeMarkers = [];

        let targetDate = new Date();
        let isRealTime = true;
        let isAutoRecenter = true;
        let updateTimer = null;

        // ISS Custom SVG Icon
        const issSvgIcon = L.divIcon({
            className: 'iss-icon-glow',
            html: `
                <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="32" r="28" fill="rgba(0, 255, 255, 0.25)" stroke="#00ffff" stroke-width="2" stroke-dasharray="4 2"/>
                    <circle cx="32" cy="32" r="7" fill="#ffffff"/>
                    <path d="M12 32H52" stroke="#00ffff" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M18 18V46M24 18V46M40 18V46M46 18V46" stroke="#00ffff" stroke-width="3"/>
                    <circle cx="32" cy="32" r="14" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
                </svg>
            `,
            iconSize: [52, 52],
            iconAnchor: [26, 26],
            popupAnchor: [0, -26]
        });

        // Calculate Position & Velocity at Given Date
        function getISSStateAt(date) {
            if (!satrec) return null;
            const pv = satellite.propagate(satrec, date);
            if (!pv || !pv.position) return null;

            const gstime = satellite.gstime(date);
            const gd = satellite.eciToGeodetic(pv.position, gstime);

            const lat = satellite.degreesLat(gd.latitude);
            let lng = satellite.degreesLong(gd.longitude);
            const alt = gd.height; // km

            // Normalize longitude to -180 .. +180
            while (lng > 180) lng -= 360;
            while (lng < -180) lng += 360;

            let speedKmH = 0;
            if (pv.velocity) {
                const v = pv.velocity;
                const vMag = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
                speedKmH = vMag * 3600; // km/s to km/h
            }

            return { lat, lng, alt, speedKmH };
        }

        // Initialize Map directly centered on ISS location
        function initMap() {
            let initialCenter = [20, 0];
            const st = getISSStateAt(new Date());
            if (st) {
                initialCenter = [st.lat, st.lng];
            }

            map = L.map('map', {
                center: initialCenter,
                zoom: 3,
                minZoom: 2,
                maxZoom: 18,
                zoomControl: false
            });

            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            // 1. Dark Matter Base Map Layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // 2. Day/Night Terminator Shadow Layer (stroke: false removes orange border line)
            try {
                terminator = L.terminator({
                    fillColor: '#000000',
                    fillOpacity: 0.62,
                    stroke: false,
                    weight: 0
                }).addTo(map);
            } catch (e) {
                console.warn('Terminator overlay error:', e);
            }

            // 3. Single Unbroken Orbit Polylines - Added AFTER Terminator
            pastPolylineGlow = L.polyline([], { color: '#ff007f', weight: 10, opacity: 0.4 }).addTo(map);
            pastPolylineCore = L.polyline([], { color: '#ff007f', weight: 5, opacity: 1.0, dashArray: '10, 8' }).addTo(map);

            futurePolylineGlow = L.polyline([], { color: '#00ffff', weight: 10, opacity: 0.45 }).addTo(map);
            futurePolylineCore = L.polyline([], { color: '#00ffff', weight: 5.5, opacity: 1.0 }).addTo(map);

            // 4. Create Footprint Circle (ISS Visibility radius ~2,200 km)
            footprintCircle = L.circle(initialCenter, {
                radius: 2200000,
                color: '#00ffff',
                fillColor: '#00ffff',
                fillOpacity: 0.12,
                weight: 2,
                dashArray: '6, 6'
            }).addTo(map);

            // 5. Create ISS Marker (Topmost element)
            issMarker = L.marker(initialCenter, { icon: issSvgIcon }).addTo(map);
            issMarker.bindPopup(`
                <div style="font-family:'Inter',sans-serif; padding:4px;">
                    <div style="font-family:'Orbitron'; font-weight:700; color:var(--accent-cyan); margin-bottom:4px;">
                        🛸 国際宇宙ステーション (ISS)
                    </div>
                    <div id="popup-content" style="font-size:0.8rem; line-height:1.4;">
                        位置情報を計算中...
                    </div>
                </div>
            `);
        }

        // Fetch Live TLE Data with fast 3s timeout (non-blocking)
        async function loadTLEData() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle', {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('CelesTrak network response error');
                const text = await response.text();
                
                const lines = text.split('\n').map(l => l.trim());
                let l1 = '', l2 = '';
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('1 25544')) {
                        l1 = lines[i];
                        l2 = lines[i + 1];
                        break;
                    }
                }

                if (l1 && l2) {
                    const freshSatrec = satellite.twoline2satrec(l1, l2);
                    if (freshSatrec && !freshSatrec.error) {
                        satrec = freshSatrec;
                        console.log('Successfully updated with fresh CelesTrak live TLE.');
                        updateSimulation(); // Refresh simulation with fresh TLE
                    }
                }
            } catch (err) {
                console.warn('Using default TLE dataset:', err.message);
            }
        }

        // Generate Anchored Orbit Points (unwrapping forward & backward relative to current ISS position)
        function generateAnchoredOrbit(startDate, minutesOffsetStart, minutesOffsetEnd, stepMinutes = 0.5) {
            const rawPoints = [];
            for (let m = minutesOffsetStart; m <= minutesOffsetEnd; m += stepMinutes) {
                const d = new Date(startDate.getTime() + m * 60000);
                const state = getISSStateAt(d);
                if (!state) continue;
                rawPoints.push({ m, lat: state.lat, lng: state.lng });
            }

            if (rawPoints.length === 0) return [];

            // Find index closest to m = 0
            let anchorIdx = 0;
            let minDist = Infinity;
            for (let i = 0; i < rawPoints.length; i++) {
                const dist = Math.abs(rawPoints[i].m);
                if (dist < minDist) {
                    minDist = dist;
                    anchorIdx = i;
                }
            }

            const res = new Array(rawPoints.length);
            res[anchorIdx] = [rawPoints[anchorIdx].lat, rawPoints[anchorIdx].lng];

            // Unwrap forward from anchor point
            for (let i = anchorIdx + 1; i < rawPoints.length; i++) {
                const prevLng = res[i - 1][1];
                let lng = rawPoints[i].lng;
                let diff = lng - prevLng;
                while (diff > 180) { lng -= 360; diff -= 360; }
                while (diff < -180) { lng += 360; diff += 360; }
                res[i] = [rawPoints[i].lat, lng];
            }

            // Unwrap backward from anchor point
            for (let i = anchorIdx - 1; i >= 0; i--) {
                const nextLng = res[i + 1][1];
                let lng = rawPoints[i].lng;
                let diff = lng - nextLng;
                while (diff > 180) { lng -= 360; diff -= 360; }
                while (diff < -180) { lng += 360; diff += 360; }
                res[i] = [rawPoints[i].lat, lng];
            }

            return res;
        }

        // Render Single Unbroken Orbit Lines & Time Badges
        function renderOrbitLines(now) {
            const pastPoints = generateAnchoredOrbit(now, -60, 0, 0.5);
            const futurePoints = generateAnchoredOrbit(now, 0, 60, 0.5);

            pastPolylineGlow.setLatLngs(pastPoints);
            pastPolylineCore.setLatLngs(pastPoints);

            futurePolylineGlow.setLatLngs(futurePoints);
            futurePolylineCore.setLatLngs(futurePoints);

            // Bring persistent polylines to front of map layers safely
            try {
                pastPolylineGlow.bringToFront();
                pastPolylineCore.bringToFront();
                futurePolylineGlow.bringToFront();
                futurePolylineCore.bringToFront();
            } catch (e) {
                console.warn('bringToFront warning:', e);
            }

            // Render Trajectory Time Badges (+15m, +30m, +45m, +60m) seamlessly along continuous future orbit line
            timeBadgeMarkers.forEach(m => map.removeLayer(m));
            timeBadgeMarkers = [];

            [15, 30, 45, 60].forEach(min => {
                // Step size is 0.5 min, so min * 2 gives exact index in futurePoints array
                const idx = Math.min(Math.round(min * 2), futurePoints.length - 1);
                if (futurePoints[idx]) {
                    const pt = futurePoints[idx];
                    const badgeIcon = L.divIcon({
                        className: 'orbit-marker-badge',
                        html: `+${min}分`,
                        iconSize: [38, 20],
                        iconAnchor: [19, 10]
                    });
                    const marker = L.marker(pt, { icon: badgeIcon }).addTo(map);
                    timeBadgeMarkers.push(marker);
                }
            });
        }

        // Update Map & Dashboard UI
        function updateSimulation() {
            const now = isRealTime ? new Date() : targetDate;
            const currentState = getISSStateAt(now);

            if (currentState) {
                const { lat, lng, alt, speedKmH } = currentState;
                const latLng = [lat, lng];

                // Update Marker & Footprint
                issMarker.setLatLng(latLng);
                footprintCircle.setLatLng(latLng);

                // Update Telemetry Panel
                document.getElementById('val-lat').textContent = `${lat.toFixed(4)}°`;
                document.getElementById('val-lng').textContent = `${lng.toFixed(4)}°`;
                document.getElementById('val-alt').innerHTML = `${Math.round(alt)} <span class="card-unit">km</span>`;
                document.getElementById('val-speed').innerHTML = `${Math.round(speedKmH).toLocaleString()} <span class="card-unit">km/h</span>`;

                // Update Popup Content safely without throwing Uncaught TypeError when popup is closed
                const popupHTML = `
                    <b>緯度:</b> ${lat.toFixed(4)}°<br>
                    <b>経度:</b> ${lat.toFixed(4)}°<br>
                    <b>高度:</b> ${Math.round(alt)} km<br>
                    <b>時速:</b> ${Math.round(speedKmH).toLocaleString()} km/h<br>
                    <b>計算時刻:</b> ${now.toLocaleTimeString('ja-JP')}
                `;
                const popupElem = document.getElementById('popup-content');
                if (popupElem) {
                    popupElem.innerHTML = popupHTML;
                }

                if (isAutoRecenter && map) {
                    map.panTo(latLng);
                }

                // Render Orbit Lines
                renderOrbitLines(now);
            }

            // Update Terminator Shadow
            if (terminator && typeof terminator.setTime === 'function') {
                terminator.setTime(now);
            }
        }

        // Setup Event Listeners
        function setupEventListeners() {
            const datetimePicker = document.getElementById('datetime-picker');
            const btnJump = document.getElementById('btn-jump');
            const btnReset = document.getElementById('btn-reset');
            const btnRecenter = document.getElementById('btn-recenter');
            const liveIndicator = document.getElementById('live-indicator');
            const simStatus = document.getElementById('sim-status');
            const toggleDashboardBtn = document.getElementById('toggle-dashboard-btn');
            const dashboard = document.getElementById('dashboard');

            // Initialize datetime picker with current local time
            const nowISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            datetimePicker.value = nowISO;

            // Jump to specified datetime
            btnJump.addEventListener('click', () => {
                if (!datetimePicker.value) return;
                targetDate = new Date(datetimePicker.value);
                isRealTime = false;

                liveIndicator.style.display = 'none';
                simStatus.textContent = 'シミュレーション表示中';
                simStatus.style.color = '#ff9f43';

                updateSimulation();
            });

            // Reset to Real-time
            btnReset.addEventListener('click', () => {
                isRealTime = true;
                targetDate = new Date();
                
                const currentISO = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                datetimePicker.value = currentISO;

                liveIndicator.style.display = 'inline-flex';
                simStatus.textContent = 'リアルタイム動作中';
                simStatus.style.color = 'var(--accent-cyan)';

                updateSimulation();
            });

            // Toggle Auto-Recenter
            btnRecenter.addEventListener('click', () => {
                isAutoRecenter = !isAutoRecenter;
                if (isAutoRecenter) {
                    btnRecenter.classList.add('btn-active');
                    if (issMarker) map.panTo(issMarker.getLatLng());
                } else {
                    btnRecenter.classList.remove('btn-active');
                }
            });

            // Mobile Dashboard Toggle
            toggleDashboardBtn.addEventListener('click', () => {
                dashboard.classList.toggle('collapsed');
            });
        }

        // Main Initialization Process
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            setupEventListeners();

            // Run Simulation Immediately with synchronous satrec
            updateSimulation();

            // Fetch live TLE asynchronously in background
            loadTLEData();

            // Real-time Update Loop (1 FPS)
            updateTimer = setInterval(() => {
                if (isRealTime) {
                    updateSimulation();
                }
            }, 1000);
        });
    </script>
</body>
