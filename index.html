<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISS Live Orbit Tracker & Simulator</title>
    
    <!-- Google Tag Manager / Analytics (Dynamically loaded via config.js) -->
    <script src="config.js" onerror="this.remove()"></script>
    <script>
        if (typeof GTM_ID !== 'undefined' && GTM_ID) {
            const gtmScript = document.createElement('script');
            gtmScript.async = true;
            gtmScript.src = `https://www.googletagmanager.com/gtag/js?id=${GTM_ID}`;
            document.head.appendChild(gtmScript);
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', GTM_ID);
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Header Overlay -->
    <div class="hud-header">
        <div class="hud-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            ISS TRACKER
        </div>
        <div class="live-badge" id="live-indicator">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <!-- Mobile Panel Toggle Button -->
    <button class="hud-toggle-btn" id="toggle-dashboard-btn" aria-label="Toggle Panel">
        ⚙
    </button>

    <!-- Dashboard Overlay -->
    <div class="hud-dashboard" id="dashboard">
        <div class="telemetry-grid">
            <div class="telemetry-card">
                <div class="card-label" id="label-lat">緯度 (LAT)</div>
                <div class="card-value" id="val-lat">--.----°</div>
            </div>
            <div class="telemetry-card">
                <div class="card-label" id="label-lng">経度 (LNG)</div>
                <div class="card-value" id="val-lng">--.----°</div>
            </div>
            <div class="telemetry-card">
                <div class="card-label" id="label-alt">高度 (ALT)</div>
                <div class="card-value" id="val-alt">--- <span class="card-unit">km</span></div>
            </div>
            <div class="telemetry-card">
                <div class="card-label" id="label-vel">速度 (VEL)</div>
                <div class="card-value" id="val-speed">--- <span class="card-unit">km/h</span></div>
            </div>
        </div>

        <div class="sim-controls">
            <div class="sim-title">
                <span id="sim-title-text">軌道シミュレーション</span>
                <span id="sim-status" style="font-size: 0.7rem; color: var(--accent-cyan);">リアルタイム動作中</span>
            </div>
            <div class="datetime-input-group">
                <input type="datetime-local" id="datetime-picker">
            </div>
            <div class="control-actions">
                <button class="btn" id="btn-jump">日時移動</button>
                <button class="btn btn-secondary" id="btn-reset">現在時刻に戻る</button>
            </div>
            <div style="margin-top: 10px; display: flex; gap: 6px;">
                <button class="btn btn-secondary btn-active" id="btn-recenter" style="width: 100%;">
                    📍 ISSの位置を中心に表示
                </button>
            </div>
        </div>
    </div>

    <!-- Legend Overlay -->
    <div class="hud-legend">
        <div class="legend-item">
            <div class="legend-color" style="background: #00ffff; box-shadow: 0 0 10px #00ffff;"></div>
            <span id="legend-future">未来1時間の予測軌道 (水色)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff007f; box-shadow: 0 0 10px #ff007f;"></div>
            <span id="legend-past">過去1時間の飛行軌跡 (ピンク破線)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: rgba(0, 243, 255, 0.2); border: 1px solid var(--accent-cyan); height: 8px; border-radius: 4px;"></div>
            <span id="legend-footprint">ISSの可視領域 (Footprint)</span>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <!-- App Script -->
    <script src="script.js"></script>
</body>
</html>
